[project]
name = "share-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "anki>=2.1.50",
    "aqt>=2.1.50",
    "pyright>=1.1.407",
    "pytest>=8.0,<9",
    "ruff>=0.15.16",
]

[tool.pyright]
include = ["addon", "scripts", "tests"]
extraPaths = ["addon"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportArgumentType = false
reportOptionalMemberAccess = false
reportPrivateImportUsage = false

[tool.pytest.ini_options]
pythonpath = ["addon"]
